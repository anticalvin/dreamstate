<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101419"><title>Dreamstate | Engine Port</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101419;color:#eef1f3;min-height:100dvh;display:grid;place-items:center;padding:24px}.panel{width:min(680px,100%);border:1px solid #3b444b;border-radius:16px;padding:28px;background:#181f25}h1{letter-spacing:.12em;margin:0 0 8px}p{line-height:1.6;color:#b9c4ca}.status{display:inline-block;border:1px solid #8b9aa4;padding:6px 10px;border-radius:99px;font-size:12px;letter-spacing:.08em}code{color:#e8f1f6}a{color:#9ad9fa}button{background:#d4e6f1;color:#111b22;border:0;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer}.result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}</style></head><body><main class="panel"><div class="status">ENGINEERING PREVIEW · NOT PLAYABLE</div><h1>DREAMSTATE</h1><p>OpenRW browser port. This page confirms static hosting and checks browser capabilities before the native C++ engine is compiled to WebAssembly.</p><button id="probe">Run browser checks</button><pre id="result" class="result" aria-live="polite">Waiting for test.</pre><p><a href="https://github.com/anticalvin/dreamstate/tree/web-port">Source and development branch</a></p></main><script>
document.querySelector('#probe').addEventListener('click',()=>{const canvas=document.createElement('canvas');let gl=null;try{gl=canvas.getContext('webgl2')}catch(e){}const lines=['WebAssembly: '+(typeof WebAssembly==='object'?'available':'unavailable'),'WebGL 2: '+(gl?'available':'unavailable'),'Touch points: '+(navigator.maxTouchPoints||0),'Viewport: '+innerWidth+' × '+innerHeight,'Secure context: '+(isSecureContext?'yes':'no'),'User agent: '+navigator.userAgent,'OpenRW engine: NOT YET COMPILED'];document.querySelector('#result').textContent=lines.join('\n');});</script></body></html>
